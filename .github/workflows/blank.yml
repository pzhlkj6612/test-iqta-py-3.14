# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      matrix:
        setup_python_by_iqta: [false, true]
        py_ver: [3.13, 3.14]
      fail-fast: false

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          repository: pzhlkj6612/forked-install-qt-action
          ref: 021b67120f07a6f1bd1f0ed4518997ff153c4226

      - run: |
          cd ./action
          npm ci
          npm run build

      # See the root "action.yml" file.
      - name: Use local built internal action (hack)
        run: |
          sed -i.bak 's|uses: $/action|uses: ./action|' action.yml
          diff -u action.yml.bak action.yml || true
          git status --porcelain
        shell: bash
          
      - name: Setup Python
        if: ${{ matrix.setup_python_by_iqta != 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py_ver }}
        
      - name: Install Qt
        uses: ./
        with:
          version: '6.11.*'
          setup-python: ${{ matrix.setup_python_by_iqta }}
